[package]
name = "muetl-tasks"
version = "0.1.0"
edition = "2021"
description = "Common utility tasks for muetl (sources, nodes, sinks)"

[dependencies]
muetl = { path = "../.." }
async-trait = "0.1.89"
tokio = { version = "1.48.0", features = ["full", "sync"] }
tracing = "0.1.43"
serde = "1.0"
serde_json = "1.0"
rquickjs = { version = "0.11.0", features = ["bindgen", "loader"] }
aws-config = { version = "1.8", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
  "credentials-process",
  "sso",
] }
aws-sdk-s3 = { version = "1.131", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
  "http-1x",
  "sigv4a",
] }
regex = "1"
cron = "0.15"
chrono = "0.4"
